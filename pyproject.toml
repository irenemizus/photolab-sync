[project]
name = "photolab-sync"
version = "0.1.0"
description = "Sync photo metadata from the file-path layout into image tags."
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10",
  "python-Levenshtein>=0.20",
  "requests>=2.28",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "build_backend"

[tool.setuptools]
  py-modules = ["metadata", "place", "record", "content_hash",
                "algorithm_builder", "sync_client", "stub_sync_server"]
